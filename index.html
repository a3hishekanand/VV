<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nandini 💕</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true"></div>
    <main class="page-transition">
      <section class="card">
        <h1 class="title">Nandini 💕</h1>
        <p class="subtitle">Will you be my Valentine? 😍</p>
        <div class="button-row">
          <button class="button yes" id="yesButton">YES 💖</button>
          <button class="button no" id="noButton">NO 🙈</button>
        </div>
        <p class="hint" id="hint">Psst... the answer is obviously Yes 😉</p>
      </section>
    </main>
    <button class="music-toggle" id="musicToggle" type="button">Play music 🎵</button>
    <audio id="bgMusic" loop>
      <source src="https://cdn.pixabay.com/download/audio/2023/02/28/audio_f2f97de707.mp3?filename=love-142442.mp3" type="audio/mpeg" />
    </audio>
    <script src="main.js"></script>
  </body>
</html>
