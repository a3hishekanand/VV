<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yes, Nandini! 💝</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
    <div class="hearts" aria-hidden="true"></div>
    <main class="page-transition">
      <section class="slideshow" aria-live="polite">
        <div class="slide-card" id="slideCard">
          <h2 class="slide-title" id="slideTitle"></h2>
          <p class="slide-text" id="slideText"></p>
          <div class="final-message" id="finalMessage" hidden>
            Happy Valentine's Day <span class="pulse-heart">💝</span>
          </div>
        </div>
        <div class="dots" id="dots"></div>
        <div class="nav-row">
          <button class="button" id="prevBtn">Back</button>
          <button class="button" id="nextBtn">Next</button>
        </div>
      </section>
    </main>
    <button class="music-toggle" id="musicToggle" type="button">Play music 🎵</button>
    <audio id="bgMusic" loop>
      <source src="https://cdn.pixabay.com/download/audio/2023/02/28/audio_f2f97de707.mp3?filename=love-142442.mp3" type="audio/mpeg" />
    </audio>
    <script src="/yes.js"></script>
  </body>
</html>
